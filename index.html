<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Lihat dan hapus metadata EXIF foto langsung di browser. Foto tidak keluar dari perangkatmu." />
    <title>EXIF Viewer dan Cleaner</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <h1>EXIF Viewer dan Cleaner</h1>
      <p class="privacy">Foto tidak keluar dari perangkatmu. Semua diproses di browser ini.</p>
    </header>
    <main>
      <label id="dropzone" class="dropzone" tabindex="0">
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/tiff,image/heic,.jpg,.jpeg,.png,.webp,.tif,.tiff,.heic" hidden />
        <strong>Seret foto ke sini</strong>
        <span>atau klik untuk memilih file (JPEG, PNG, WebP, TIFF, HEIC)</span>
      </label>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="result" hidden>
        <div class="summary">
          <img id="preview" alt="Pratinjau foto" />
          <div id="meta"></div>
        </div>
        <div id="groups"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
